name: Post coverage comment

on: # zizmor: ignore[dangerous-triggers] Posts only the generated comment artifact; never checks out PR code.
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions: {}

jobs:
  post-comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Post coverage comment for forked pull request
        uses: py-cov-action/python-coverage-comment-action@5d8df5979747514c914e1c5a12335a7cf9a2745f # v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
          ACTIVITY: post_comment
